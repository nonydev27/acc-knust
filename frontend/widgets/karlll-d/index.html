<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACC KNUST Session Countdown</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="card">
    <span class="tag">ACC KNUST • Frontend Track</span>
    <h1 id="title">Git &amp; Frontend Clinic</h1>
    <p id="details" class="details">KNUST • Saturday Session</p>

    <div class="buttons">
      <button type="button" class="button active" data-session="clinic">
        Clinic
      </button>
      <button type="button" class="button" data-session="workshop">
        Workshop
      </button>
    </div>

    <div class="timer">
      <div class="box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <p id="status" class="status">Loading countdown...</p>
  </main>

  <script src="./script.js"></script>
</body>
</html>
