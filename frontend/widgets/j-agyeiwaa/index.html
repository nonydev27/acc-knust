<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ACC KNUST Event Countdown</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <main class="countdown-card">
          <h1>ACC KNUST</h1>
          <h2>Upcoming Event</h2>
          <p class="event-name">AmaliTech Coding Club Meeting</p>
          <p class="event-description">Get ready for our next session</p>

          <div class="countdown">
               <div class="time-box">
                    <span id="days">00</span>
                    <p>Days</p>
               </div>
               <div class="time-box">
                    <span id="hours">00</span>
                    <p>Hours</p>
               </div>
               <div class="time-box">
                    <span id="minutes">00</span>
                    <p>Minutes</p>
               </div>
               <div class="time-box">
                    <span id="seconds">00</span>
                    <p>Seconds</p>
               </div>
          </div>

          <p id="countdown-message">Counting down to our next meeting</p>
     </main>
     <script src="script.js"></script>
</body>
</html>
