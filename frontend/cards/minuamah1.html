<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maymuna Ishaak | Profile Card</title>
      <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #3a0f1c;
    background:
      radial-gradient(circle at top left, #a33a5b 0%, transparent 35%),
      radial-gradient(circle at bottom right, #4d1027 0%, transparent 40%),
      #7a1f3d;
  }

  .profile-card {
    width: 100%;
    max-width: 400px;
    min-height: 600px;
    padding: 3.5rem 2.5rem;
    text-align: center;

    background: rgba(255, 255, 255, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 28px;

    box-shadow:
      0 30px 70px rgba(35, 5, 15, 0.35),
      0 8px 25px rgba(35, 5, 15, 0.15);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;
  }

  .profile-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: #7a1f3d;
  }

  .profile-card::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    top: -100px;
    right: -90px;
    background: rgba(122, 31, 61, 0.08);
    border-radius: 50%;
  }

    .name {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.2;
    color: #7a1f3d;
    margin-bottom: 0.5rem;
  }

  .role {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #a33a5b;
    margin-bottom: 1.5rem;
  }

  .bio {
    font-size: 1rem;
    line-height: 1.7;
    color: #5c3a45;
    max-width: 30ch;
    margin-bottom: 2rem;
  }

  .github-link {
    display: inline-block;
    padding: 0.8rem 1.8rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: #ffffff;
    background: #7a1f3d;
    border-radius: 999px;
    text-decoration: none;
  }

    .github-link {
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .github-link:hover,
  .github-link:focus-visible {
    background: #a33a5b;
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(122, 31, 61, 0.3);
  }

  @media (max-width: 480px) {
    body {
      padding: 1rem;
    }

    .profile-card {
      min-height: auto;
      padding: 2.5rem 1.5rem;
    }

    .name {
      font-size: 1.6rem;
    }
  }
</style>
</head>
<body>
  <article class="profile-card">
    <h1 class="name">Nuamah Maymuna Ishaak</h1>
    <p class="role">Frontend Developer</p>
    <p class="bio">
      IT student at KNUST who loves turning ideas into clean, responsive
      interfaces.
    </p>
    <a class="github-link" href="https://github.com/minuamah1" target="_blank" rel="noopener">
      GitHub: minuamah1
    </a>
  </article>
</body>
</html>
